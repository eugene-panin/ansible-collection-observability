---
dependency:
  name: galaxy
  options:
    requirements-file: molecule/default/requirements.yml
driver:
  name: docker
platforms:
  - name: instance-grafana
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2404}-ansible:latest"
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        _grafana_test_address: "{{ ansible_facts['default_ipv4']['address'] }}"
        loki_bind_address: "{{ _grafana_test_address }}"
        mimir_bind_address: "{{ _grafana_test_address }}"
        tempo_bind_address: "{{ _grafana_test_address }}"
        grafana_bind_address: "{{ _grafana_test_address }}"
        grafana_loki_url: "http://{{ _grafana_test_address }}:3100"
        grafana_mimir_url: "http://{{ _grafana_test_address }}:9009/prometheus"
        grafana_tempo_url: "http://{{ _grafana_test_address }}:3200"
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    side_effect: side_effect.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - check
    - converge
    - idempotence
    - check
    - side_effect
    - verify
    - destroy
