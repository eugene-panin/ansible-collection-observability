---
- name: Render grafana.ini
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: "{{ grafana_config_dir }}/grafana.ini"
    owner: root
    group: "{{ grafana_group }}"
    mode: '0640'
  no_log: true
  notify: "restart grafana"

- name: Provision the data sources
  ansible.builtin.copy:
    content: "{{ {'apiVersion': 1, 'prune': true, 'datasources': _grafana_datasources_all} | to_nice_yaml(indent=2, sort_keys=false) }}"
    dest: "{{ grafana_config_dir }}/provisioning/datasources/eugene_panin.yaml"
    owner: root
    group: "{{ grafana_group }}"
    mode: '0640'
  notify: "restart grafana"

- name: Install the systemd unit
  ansible.builtin.template:
    src: grafana.service.j2
    dest: /etc/systemd/system/grafana.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - "reload systemd"
    - "restart grafana"
