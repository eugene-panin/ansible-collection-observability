---
- name: Upgrade to the next release
  hosts: all
  become: true
  vars:
    alloy_version: 1.19.2
  roles:
    - role: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"

- name: Hand the role a pipeline that does not parse
  hosts: all
  become: true
  vars:
    alloy_version: 1.19.2
    alloy_extra_config: this is not alloy syntax
  tasks:
    - name: Apply the role and expect it to stop
      block:
        - name: Apply the role
          ansible.builtin.include_role:
            name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"

        - name: The role must not get this far
          ansible.builtin.fail:
            msg: the role installed a pipeline alloy fmt rejects
      rescue:
        - name: Assert it stopped at validation
          ansible.builtin.assert:
            that:
              - "'failed to validate' in ansible_failed_result.msg | default('')"
            quiet: true
