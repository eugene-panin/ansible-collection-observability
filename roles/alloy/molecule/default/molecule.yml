---
dependency:
  name: galaxy
  options:
    requirements-file: molecule/default/requirements.yml
driver:
  name: docker
platforms:
  - name: instance-alloy
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2404}-ansible:latest"
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        _alloy_test_address: "{{ ansible_facts['default_ipv4']['address'] }}"
        loki_bind_address: "{{ _alloy_test_address }}"
        mimir_bind_address: "{{ _alloy_test_address }}"
        tempo_bind_address: "{{ _alloy_test_address }}"
        alloy_mimir_remote_write_url: "http://{{ _alloy_test_address }}:9009/api/v1/push"
        alloy_loki_push_url: "http://{{ _alloy_test_address }}:3100/loki/api/v1/push"
        alloy_tempo_otlp_endpoint: "{{ _alloy_test_address }}:4317"
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    side_effect: side_effect.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - check
    - converge
    - idempotence
    - check
    - side_effect
    - verify
    - destroy
