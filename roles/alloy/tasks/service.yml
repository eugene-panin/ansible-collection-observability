---
- name: Ensure alloy is enabled and running
  ansible.builtin.systemd_service:
    name: alloy
    enabled: true
    state: started
    daemon_reload: true
  when: _alloy_live | bool

- name: Wait until Alloy reports ready
  ansible.builtin.uri:
    url: "http://{{ alloy_http_listen_address }}/-/ready"
  register: _alloy_ready
  until: _alloy_ready.status | default(0) == 200
  retries: 60
  delay: 2
  when: _alloy_live | bool
  check_mode: false
