---
alloy_version: 1.19.2
alloy_http_listen_address: 127.0.0.1:12345

alloy_bin_dir: /usr/local/bin
alloy_user: alloy
alloy_group: alloy
alloy_extra_groups:
  - adm
  - systemd-journal
alloy_config_dir: /etc/alloy
alloy_data_dir: /var/lib/alloy

alloy_instance: "{{ inventory_hostname }}"

alloy_mimir_remote_write_url: ""
alloy_loki_push_url: ""
alloy_tempo_otlp_endpoint: ""
alloy_tempo_otlp_insecure: true

alloy_host_metrics: true
alloy_journal_logs: true
alloy_otlp_receiver: true
alloy_otlp_listen_address: 127.0.0.1
alloy_otlp_grpc_port: 4317
alloy_otlp_http_port: 4318

alloy_extra_config: ""
