---
- name: Check whether tempo is already installed
  ansible.builtin.stat:
    path: "{{ tempo_bin_dir }}/tempo"
  register: _tempo_binary_stat
  check_mode: false

- name: Ensure the tempo group exists
  ansible.builtin.group:
    name: "{{ tempo_group }}"
    system: true
    state: present

- name: Ensure the tempo user exists
  ansible.builtin.user:
    name: "{{ tempo_user }}"
    group: "{{ tempo_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ tempo_data_dir }}"
    create_home: false
    state: present

- name: Install the tempo binary
  ansible.builtin.include_role:
    name: eugene_panin.observability.grafana_release
  vars:
    grafana_release_product: tempo
    grafana_release_version: "{{ tempo_version }}"
    grafana_release_bin_dir: "{{ tempo_bin_dir }}"

- name: Queue a restart when the binary is about to change
  ansible.builtin.debug:
    msg: "tempo {{ tempo_version }}"
  changed_when: grafana_release_changed | bool
  notify: "restart tempo"

- name: Ensure the tempo directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ tempo_user }}"
    group: "{{ tempo_group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ tempo_config_dir }}"
      mode: '0750'
    - path: "{{ tempo_data_dir }}"
      mode: '0750'
  loop_control:
    label: "{{ item.path }}"
