---
- name: Render the configuration
  ansible.builtin.copy:
    content: "{{ _tempo_rendered | to_nice_yaml(indent=2, sort_keys=false) }}"
    dest: "{{ tempo_config_dir }}/tempo.yml"
    owner: root
    group: "{{ tempo_group }}"
    mode: '0640'
  no_log: "{{ tempo_storage == 's3' }}"
  notify: "restart tempo"

- name: Install the systemd unit
  ansible.builtin.template:
    src: tempo.service.j2
    dest: /etc/systemd/system/tempo.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - "reload systemd"
    - "restart tempo"
