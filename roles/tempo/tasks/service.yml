---
- name: Ensure tempo is enabled and running
  ansible.builtin.systemd_service:
    name: tempo
    enabled: true
    state: started
    daemon_reload: true
  when: _tempo_live | bool

- name: Wait until Tempo reports ready
  ansible.builtin.uri:
    url: "{{ _tempo_api }}/ready"
  register: _tempo_ready
  until: _tempo_ready.status | default(0) == 200
  retries: 60
  delay: 2
  when: _tempo_live | bool
  check_mode: false
