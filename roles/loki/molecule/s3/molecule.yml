---
dependency:
  name: galaxy
  options:
    requirements-file: molecule/s3/requirements.yml
driver:
  name: docker
platforms:
  - name: instance-loki-s3
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2404}-ansible:latest"
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        loki_bind_address: "{{ ansible_facts['default_ipv4']['address'] }}"
        _loki_test_api: "http://{{ ansible_facts['default_ipv4']['address'] }}:3100"
        loki_storage: s3
        loki_s3_endpoint: 127.0.0.1:9000
        loki_s3_bucket: loki
        loki_s3_access_key: molecule
        loki_s3_secret_key: molecule-secret
        loki_s3_insecure: true
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - check
    - converge
    - idempotence
    - check
    - verify
    - destroy
