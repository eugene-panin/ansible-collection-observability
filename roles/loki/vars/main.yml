---
_loki_live: "{{ not (ansible_check_mode and not _loki_binary_stat.stat.exists | default(false)) }}"
_loki_api: "http://{{ loki_bind_address }}:{{ loki_http_port }}"

_loki_storage_filesystem:
  filesystem:
    chunks_directory: "{{ loki_data_dir }}/chunks"
    rules_directory: "{{ loki_data_dir }}/rules"

_loki_storage_s3:
  s3:
    endpoint: "{{ loki_s3_endpoint }}"
    bucketnames: "{{ loki_s3_bucket }}"
    region: "{{ loki_s3_region }}"
    access_key_id: "{{ loki_s3_access_key }}"
    secret_access_key: "{{ loki_s3_secret_key }}"
    insecure: "{{ loki_s3_insecure | bool }}"
    s3forcepathstyle: "{{ loki_s3_force_path_style | bool }}"

_loki_config:
  auth_enabled: "{{ loki_auth_enabled | bool }}"
  server:
    http_listen_address: "{{ loki_bind_address }}"
    http_listen_port: "{{ loki_http_port | int }}"
    grpc_listen_address: "{{ loki_bind_address }}"
    grpc_listen_port: "{{ loki_grpc_port | int }}"
    log_level: info
  common:
    instance_addr: "{{ loki_bind_address }}"
    path_prefix: "{{ loki_data_dir }}"
    replication_factor: 1
    ring:
      kvstore:
        store: inmemory
    storage: "{{ _loki_storage_s3 if loki_storage == 's3' else _loki_storage_filesystem }}"
  schema_config:
    configs:
      - from: "{{ loki_schema_from }}"
        store: tsdb
        object_store: "{{ loki_storage }}"
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: "{{ loki_retention_period }}"
  compactor:
    working_directory: "{{ loki_data_dir }}/compactor"
    retention_enabled: true
    delete_request_store: "{{ loki_storage }}"
  analytics:
    reporting_enabled: false

_loki_rendered: "{{ _loki_config | combine(loki_extra_config, recursive=True) }}"
