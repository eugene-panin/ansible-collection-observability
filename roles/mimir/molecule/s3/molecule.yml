---
dependency:
  name: galaxy
  options:
    requirements-file: molecule/s3/requirements.yml
driver:
  name: docker
platforms:
  - name: instance-mimir-s3
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2404}-ansible:latest"
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        mimir_bind_address: "{{ ansible_facts['default_ipv4']['address'] }}"
        _mimir_test_api: "http://{{ ansible_facts['default_ipv4']['address'] }}:9009"
        mimir_storage: s3
        mimir_s3_endpoint: 127.0.0.1:9000
        mimir_s3_bucket: mimir
        mimir_s3_access_key: molecule
        mimir_s3_secret_key: molecule-secret
        mimir_s3_insecure: true
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - check
    - converge
    - idempotence
    - check
    - verify
    - destroy
