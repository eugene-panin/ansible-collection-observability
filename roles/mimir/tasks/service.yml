---
- name: Ensure mimir is enabled and running
  ansible.builtin.systemd_service:
    name: mimir
    enabled: true
    state: started
    daemon_reload: true
  when: _mimir_live | bool

- name: Wait until Mimir reports ready
  ansible.builtin.uri:
    url: "{{ _mimir_api }}/ready"
  register: _mimir_ready
  until: _mimir_ready.status | default(0) == 200
  retries: 60
  delay: 2
  when: _mimir_live | bool
  check_mode: false
