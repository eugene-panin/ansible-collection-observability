---
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linters
        run: python -m pip install --upgrade ansible-core ansible-lint yamllint

      - name: Install the collections the roles and tests call
        run: ansible-galaxy collection install community.general

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint --profile production

  sanity:
    name: sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/eugene_panin/observability

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-core
        run: python -m pip install --upgrade ansible-core

      - name: ansible-test sanity
        run: ansible-test sanity --docker default --python 3.12
        working-directory: ansible_collections/eugene_panin/observability

  molecule:
    name: molecule (${{ matrix.role }}, ${{ matrix.distro }}, ansible-core ${{ matrix.ansible_core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [grafana_release, loki, mimir, tempo, grafana, alloy]
        distro: [ubuntu2404, ubuntu2204, debian12]
        ansible_core: [latest]
        include:
          - role: grafana_release
            distro: ubuntu2404
            ansible_core: '2.19'
          - role: loki
            distro: ubuntu2404
            ansible_core: '2.19'
          - role: mimir
            distro: ubuntu2404
            ansible_core: '2.19'
          - role: tempo
            distro: ubuntu2404
            ansible_core: '2.19'
          - role: grafana
            distro: ubuntu2404
            ansible_core: '2.19'
          - role: alloy
            distro: ubuntu2404
            ansible_core: '2.19'
    env:
      MOLECULE_DISTRO: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install molecule
        run: >-
          python -m pip install --upgrade
          ${{ matrix.ansible_core == 'latest' && 'ansible-core' || format('ansible-core=={0}.*', matrix.ansible_core) }}
          molecule 'molecule-plugins[docker]' docker

      - name: molecule test
        run: molecule test --all
        working-directory: roles/${{ matrix.role }}

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-core
        run: python -m pip install --upgrade ansible-core

      - name: Build the collection artifact
        run: ansible-galaxy collection build --output-path dist

      - uses: actions/upload-artifact@v4
        with:
          name: collection
          path: dist/*.tar.gz
